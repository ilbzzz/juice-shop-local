name: CodeMender Security Remediation

on:
  schedule:
    - cron: '0 2 * * 0' # Run at 2:00 AM UTC, only on Sunday
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scan_target:
        description: 'Subdirectory path to scan'
        required: false
        default: '.'
      max_tasks:
        description: 'Maximum parallel worker tasks'
        required: false
        default: '10'
      build_command:
        description: 'Custom build & test command for verification'
        required: false
        default: 'npm install && npm test'
        type: string

# Grant permissions required by the 3-stage pipeline
permissions:
  id-token: write
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  packages: read

jobs:
  remediate:
    # Only run on Schedule, Manual Trigger, or PRs with 'security-scan' label
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'security-scan'))
    # uses: ilbzzz/codemender-agent/.github/workflows/codemender_parallel.yml@development
    uses: ./.github/workflows/codemender_parallel.yml
    with:
      scan_target: ${{ inputs.scan_target || '.' }}
      # Passes the input from workflow_dispatch, or falls back to 'npm install && npm test' on schedule/push
      build_command: ${{ inputs.build_command || 'npm install && npm test' }}
      max_tasks: ${{ github.event_name == 'pull_request' && 4 || 10 }}
      upload_sarif: true
    secrets:
      gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      github_app_id: ${{ secrets.GH_APP_ID }}
      github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
